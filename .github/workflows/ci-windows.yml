name: build-windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new commit cancels the superseded run for the same branch
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      # one failing leg cancels the remaining legs: the digest still
      # lists every error of the failing leg, and runner time is not
      # wasted on a doomed build
      fail-fast: true
      matrix:
        arch: [x86, x64]
        config: [debug, release]
        include:
          - arch: x86
            preset: win86
          - arch: x64
            preset: win64
    steps:
      - uses: actions/checkout@v4
      - name: clean stale log
        shell: bash
        run: rm -f build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: setup msvc environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: configure
        shell: bash
        run: |
          set -o pipefail
          # Ninja finds cl.exe through the activated MSVC environment
          cmake --preset ${{ matrix.preset }}-${{ matrix.config }} 2>&1 | tee -a build.log
      - name: build
        shell: bash
        run: |
          set -o pipefail
          # ninja keeps going on parallel failures, so the digest lists
          # every failing file in one run
          cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }} --parallel 4 2>&1 | tee -a build.log
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: windows-${{ matrix.arch }}-${{ matrix.config }}
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            log-windows-${{ matrix.arch }}-${{ matrix.config }}.log
            digest-fragment-windows-${{ matrix.arch }}-${{ matrix.config }}.md
            status-windows-${{ matrix.arch }}-${{ matrix.config }}
          if-no-files-found: ignore
